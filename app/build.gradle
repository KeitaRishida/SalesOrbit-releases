plugins { id 'com.android.application' }
android {
    namespace 'com.keitarishida.bbtea'
    compileSdk 35
    defaultConfig {
        applicationId 'com.keitarishida.bbtea'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword 'bb-tea-local-release-2026'
            keyAlias 'bbtea'
            keyPassword 'bb-tea-local-release-2026'
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
