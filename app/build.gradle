plugins { id 'com.android.application' }

android {
    namespace 'com.keitarishida.bbtea'
    compileSdk 35
    defaultConfig {
        applicationId 'com.keitarishida.bbtea'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        stable {
            storeFile file('../signing/bbtea.jks')
            storePassword 'bbt3a2026'
            keyAlias 'bbtea'
            keyPassword 'bbt3a2026'
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.stable } }
}