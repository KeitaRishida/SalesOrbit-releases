name: Scheduled BB Tea Season 8 refresh
on:
  schedule:
    - cron: '29 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BB Tea branch
        uses: actions/checkout@v4
        with:
          ref: bigg-boss-malayalam-app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run filter tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Search YouTube and update cache
        run: python scripts/update_feed.py
      - name: Push new discoveries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/videos.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Bigg Boss Malayalam videos'
            git push origin HEAD:bigg-boss-malayalam-app
          fi
