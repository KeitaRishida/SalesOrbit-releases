name: Build BB Tea Android
on:
  push:
    branches: [bigg-boss-malayalam-app]
    paths:
      - 'app/**'
      - 'signing/**'
      - '.github/workflows/bb-tea-android.yml'
      - 'build.gradle'
      - 'settings.gradle'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bigg-boss-malayalam-app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: |
          SDK_TOOL=$(find /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n1)
          if [ -n "$SDK_TOOL" ]; then
            yes | "$SDK_TOOL" --licenses > /dev/null || true
            "$SDK_TOOL" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Restore reproducible signing certificate
        run: base64 -d signing/keystore.base64.txt > signing/bbtea.jks
      - name: Compile APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Publish update and signed APK
        run: |
          mkdir -p updates
          cp app/build/outputs/apk/release/app-release.apk updates/bb-tea.apk
          python3 - <<'PY'
          import hashlib, json, pathlib
          apk=pathlib.Path('updates/bb-tea.apk')
          manifest={
            'versionCode':2,
            'versionName':'1.1.0',
            'apkUrl':'https://raw.githubusercontent.com/KeitaRishida/SalesOrbit-releases/bigg-boss-malayalam-app/updates/bb-tea.apk',
            'sha256':hashlib.sha256(apk.read_bytes()).hexdigest()
          }
          pathlib.Path('updates/update.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BB-Tea-1.1.0-APK
          path: updates/bb-tea.apk
      - name: Publish APK to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/bb-tea.apk updates/update.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish signed BB Tea v1.1.0'
            git pull --rebase origin bigg-boss-malayalam-app
            git push origin HEAD:bigg-boss-malayalam-app
          fi